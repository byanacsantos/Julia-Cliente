<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Estevão'Wines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(var(--bg-rgb), 0.85), rgba(var(--bg-rgb), 0.95)), url('assets/hero-serving.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
            transition: background-color var(--transition-speed);
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: rgba(var(--text-color-rgb), 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            padding: 50px;
            border-radius: 4px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            text-align: center;
            color: var(--text-color);
        }

        /* Estilo para garantir visibilidade dos inputs no modo claro */
        input {
            background: rgba(var(--text-color-rgb), 0.05) !important;
            border-color: var(--border-color) !important;
            color: var(--text-color) !important;
        }

        .auth-header {
            margin-bottom: 40px;
            position: relative;
        }

        .theme-toggle-auth {
            position: absolute;
            top: -30px;
            right: -30px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 10px;
        }

        .theme-toggle-auth svg { width: 24px; height: 24px; }
        
        /* Ocultar ícones baseado no tema */
        body.light-mode .sun-icon { display: none; }
        body:not(.light-mode) .moon-icon { display: none; }

        .auth-header .monogram {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(245, 230, 200, 0.1);
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.5;
            transition: 0.3s;
        }

        .auth-tab.active {
            opacity: 1;
            border-bottom: 2px solid var(--butter-yellow);
        }

        .auth-form {
            display: none;
            text-align: left;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .auth-btn {
            width: 100%;
            margin-top: 10px;
        }

        .auth-footer {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .auth-footer a {
            color: var(--butter-yellow);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            border-bottom: 1px solid var(--butter-yellow);
        }

        .pass-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-pass {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: #4B0F1A; /* Cor escura fixa conforme solicitado */
            cursor: pointer;
            opacity: 0.8;
            transition: 0.3s;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .toggle-pass:hover {
            opacity: 1;
        }

        .toggle-pass svg {
            width: 20px;
            height: 20px;
        }

        #auth-status {
            margin-top: 20px;
            font-size: 0.85rem;
            min-height: 20px;
        }
        
        .success-msg { color: #28a745; }
        .error-msg { color: #dc3545; }
    </style>
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <div class="monogram">EW</div>
                <h2 style="font-family: 'Playfair Display', serif; font-size: 1.8rem;">Estevão'Wines</h2>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Entrar</div>
                <div class="auth-tab" data-tab="signup">Criar Conta</div>
            </div>

            <!-- Formulário de Login -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="login-pass">Senha</label>
                    <div class="pass-wrapper">
                        <input type="password" id="login-pass" required placeholder="••••••••">
                        <button type="button" class="toggle-pass" data-target="login-pass">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Entrar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Nome Completo</label>
                    <input type="text" id="signup-name" required placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="signup-email">E-mail</label>
                    <input type="email" id="signup-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="signup-pass">Senha</label>
                    <div class="pass-wrapper">
                        <input type="password" id="signup-pass" required placeholder="Crie uma senha">
                        <button type="button" class="toggle-pass" data-target="signup-pass">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Criar Minha Conta</button>
            </form>

            <div id="auth-status"></div>

            <div class="auth-footer">
                <a href="index.html">Voltar para a página inicial</a>
            </div>
        </div>
    </main>

    <script>
        // Lógica de Temas (Sincronização)
        const body = document.body;

        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-mode');
        }

        // Lógica de Alternância de Abas
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-form`).classList.add('active');
            });
        });

        // Lógica de Visualizar Senha
        const togglePassBtns = document.querySelectorAll('.toggle-pass');
        togglePassBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                const svg = btn.querySelector('svg');

                if (input.type === 'password') {
                    input.type = 'text';
                    // Mudar ícone para "olho riscado"
                    svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                } else {
                    input.type = 'password';
                    // Voltar para ícone de "olho aberto"
                    svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
                }
            });
        });

        // Simulação de Autenticação com LocalStorage
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const statusDiv = document.getElementById('auth-status');

        // Signup
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-pass').value;

            const users = JSON.parse(localStorage.getItem('ew-users') || '[]');
            
            if (users.find(u => u.email === email)) {
                statusDiv.innerHTML = '<span class="error-msg">Este e-mail já está cadastrado.</span>';
                return;
            }

            users.push({ name, email, pass });
            localStorage.setItem('ew-users', JSON.stringify(users));
            
            statusDiv.innerHTML = '<span class="success-msg">Conta criada com sucesso! Você já pode entrar.</span>';
            setTimeout(() => tabs[0].click(), 1500);
        });

        // Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            const users = JSON.parse(localStorage.getItem('ew-users') || '[]');
            const user = users.find(u => u.email === email && u.pass === pass);

            if (user) {
                localStorage.setItem('ew-logged-in', JSON.stringify(user));
                statusDiv.innerHTML = '<span class="success-msg">Bem-vindo à Estevão\'Wines! Entrando...</span>';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                statusDiv.innerHTML = '<span class="error-msg">E-mail ou senha incorretos.</span>';
            }
        });
    </script>
</body>
</html>
